server.port=3003

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 达梦数据库配置 (DIG_GEO schema)
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.url=jdbc:dm://localhost:5236
spring.datasource.username=SYSDBA
spring.datasource.password=SYSdba2026
# 达梦默认「当前 schema」= 登录用户名(SYSDBA)，但表实际建在 DIG_GEO schema 下；
# 连接建立后切到 DIG_GEO，否则未加前缀的表名(如 FROM PROJECTS)会报「无效的表或视图名」
spring.datasource.hikari.connection-init-sql=SET SCHEMA DIG_GEO

# SQL 初始化
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# 调试日志
logging.level.com.antv.l7vp=DEBUG

# JSON配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 缩略图配置
l7vp.thumbnails.path=./thumbnails
l7vp.thumbnails.url-prefix=/thumbnails

# ========================================
# 数据中台 SSO OAuth2 认证配置（Authorization Code 流程）
# 部署时用环境变量覆盖（改环境变量即可，不用改代码）：
#   ZHONGTAI_BASE_URL         中台服务基地址（含端口），默认 http://10.16.1.6:8081
#   APP_FRONTEND_URL          地图软件自身前端地址（SSO 回调），默认 http://localhost:3003（单 jar，本机直接跑）
#   ZHONGTAI_CLIENT_ID        中台 OAuth 客户端 ID（默认占位值 clientId）
#   ZHONGTAI_CLIENT_SECRET    中台 OAuth 客户端密钥（默认占位值 clientSecret）
# ========================================
zhongtai.sso.authorize-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/authorize
zhongtai.sso.token-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/token
zhongtai.sso.userinfo-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/userinfo
zhongtai.sso.logout-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/logout
zhongtai.sso.redirect-uri=${APP_FRONTEND_URL:http://localhost:3003}/api/auth/callback
zhongtai.sso.frontend-url=${APP_FRONTEND_URL:http://localhost:3003}
zhongtai.sso.client-id=${ZHONGTAI_CLIENT_ID:clientId}
zhongtai.sso.client-secret=${ZHONGTAI_CLIENT_SECRET:clientSecret}

# 中台 API 地址（基地址统一由 ZHONGTAI_BASE_URL 控制）
zhongtai.api.resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/dataResource/list
zhongtai.api.api-resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/apiResource/list
zhongtai.api.unit-instance-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/unit/instance/list
zhongtai.api.connect-info-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/plugin/connect/info

# 应用库 appId（已停用：unit/instance/list 传 appId 会限制只查某个实例下的库，默认不再传。
# 保留此配置仅作显式传入时的历史兜底，未用到可删除）
zhongtai.api.app-id=${ZHONGTAI_APP_ID:872138c1-cd41-4695-aa03-e9f1d4aefc28}

# 中台 API 默认 Header 参数
# 空间 ID 现在作为兜底默认值：中台编配嵌入时会在 URL 带 space_id，前端动态读取后传给后端（优先于本默认值）
zhongtai.api.space-id=${ZHONGTAI_SPACE_ID:79503c5c0eca4d159d051fc51a86cbed}
zhongtai.api.scope-type=Space
# zhongtai.api.tenant-id=

# Token 缓存时间（分钟，已废弃 — 现在使用用户 Session）
# zhongtai.token.cache-minutes=30

# HTTP Session 最大空闲时间（秒），默认 8 小时
zhongtai.session.max-inactive-interval=28800
server.servlet.session.timeout=28800

# =====================================================================
# 登录模式（值直接写死在本文件；改动后重新打包生效）
#   sso   = 中台 SSO 集成登录（默认）：未登录跳转中台 SSO，与本文件上方 zhongtai.sso.* 配套
#   local = 本地开放访问：无需登录直接进首页（不依赖中台 SSO），后端以默认本地用户自动建会话；
#           业务接口(projects/datasets/layers/...)可正常使用，中台数据资源(/api/zhongtai/*)不可用(401)
# =====================================================================
l7vp.auth.mode=local
# （可选）local 模式下默认会话的显示名，默认「本地用户」
# l7vp.auth.local.display-name=本地用户

# 图标配置
# 开发环境路径（相对于java-server目录）
# 内网部署环境路径通过启动参数覆盖：--l7vp.icons.path=/opt/L7VP/frontend/icons
l7vp.icons.path=../website/public/icons
l7vp.icons.url-prefix=/icons

# =====================================================================
# 外部数据源（db-connections）查询
# 数据集运行时调 /api/db-connections/{id}/tables/{table}/data?columns=a,b,c 拉数。
#   columns  可选，逗号分隔列名；不传 = 全列。**宽表必须传**：
#            实测一个 4.5KB 的 jsonb 列能把 4000 行的响应从 0.9MB 顶到 23MB，
#            前端反复中断重试、数据集预览一直空。选列后同一数据集只剩 0.9MB。
#   limit    可选，覆盖下面的默认行数上限。
# 默认上限防的是「一张几十万行的表把浏览器打挂」；宽表的问题是列不是行，靠 columns 解决。
#   L7VP_DB_MAX_ROWS  默认 20000（硬顶 200000，请求里要更多也不越过）
# =====================================================================
l7vp.db-connection.max-rows=${L7VP_DB_MAX_ROWS:20000}

# =====================================================================
# 流式数据集 / WebSocket 配置
# 单 jar 双端口拓扑：HTTP(l7vp) 走 server.port=3003，WebSocket 走 l7vp.ws.port=3002。
# 部署时可用环境变量覆盖，无需改代码：
#   L7VP_WS_PORT            WebSocket 服务端口（默认 3002；留空则与 HTTP 同端口 3003）
#   L7VP_STREAM_MAX_WINDOW  每个流式数据集内存环形缓冲最大行数，默认 1000
#   L7VP_STREAM_PUSH_TOKEN  Flink 推送鉴权令牌；留空则不强制鉴权（仅内网/受控环境留空）
# =====================================================================
l7vp.ws.port=${L7VP_WS_PORT:3002}
l7vp.stream.max-window=${L7VP_STREAM_MAX_WINDOW:1000}
l7vp.stream.push-token=${L7VP_STREAM_PUSH_TOKEN:}

# =====================================================================
# Flink 流式作业提交配置（值直接写死在本文件；改动后重新打包生效）
# java-server 运行期把内嵌作业jar(flink-job/l7vp-stream-job.jar)上传到 Flink 集群并提交，
# 作业批量回推本服务的 /stream/push。
#   auto-start              保存项目时自动为含 kafka 配置的流式数据集提交作业
#   cluster.url             Flink 集群 REST 地址（含协议端口）
#   job.entry-class         作业入口类（一般无需改）
#   job.parallelism         作业并行度
#   job.batch-size          单批回推行数
#   job.batch-ms            攒批窗口毫秒
#   job.jar-file-path       外部作业 jar 绝对路径（空=用内嵌）
#   push.base-url           集群侧能访问到的本服务地址(不带尾/)，生产务必确认指向 java-server
#   push.token              回推鉴权令牌（为空则不携带 X-Stream-Token）
#   kafka.bootstrap-servers Kafka 兜底地址
#   kafka.group-id-prefix   作业 group.id 前缀
#   kafka.auto-offset-reset 作业消费起始位置 earliest|latest（默认 latest=生产实时只读新消息）
#                           测试/历史回放想先灌存量时设 earliest
# Kafka topic / bootstrapServers 优先按数据集存于 metadata.kafka（由前端「流式数据」配置），
# 本文件 bootstrap-servers 仅作兜底。
# =====================================================================
flink.auto-start=true
# 本机单机验证：Flink 与 java-server 同机，用 localhost 即可（勿填 192.168.10.1，本机连不通）
flink.cluster.url=http://localhost:8081
flink.job.entry-class=com.antv.l7vp.flink.StreamDatasetJob
flink.job.parallelism=1
flink.job.batch-size=200
flink.job.batch-ms=500
flink.job.jar-file-path=
flink.push.base-url=http://localhost:3003
flink.push.token=
# 本机无内网 kafka；数据集 metadata.kafka 已是远端回放 47.114.38.21:9094，此处仅作兜底，保持一致
flink.kafka.bootstrap-servers=47.114.38.21:9094
flink.kafka.group-id-prefix=l7vp-stream
flink.kafka.auto-offset-reset=earliest

# Flink 作业落时序库（TimescaleDB/PostGIS）——可选。enabled=true 且 url 非空时，
# 作业每条消息除回推 WebSocket(实时刷新)外，还会批量写入时序表(stream_events jsonb 超表，作业幂等自建)。
#   url         JDBC 地址（对应 docker kag-timescaledb 服务：库 maritime，host 映射端口 5432）
#   user/pass   时序库账号
#   table       落库表名
#   time-field  payload 中的事件时间键（epoch毫秒/秒 或 ISO 或 yyyy-MM-dd HH:mm:ss）；
#               留空则按 t/time/timestamp/ts/event_time/eventTime 探测，探测不到用作业入库时间
# 注意：password 会明文经 programArgs 传给作业，内网可用；外网建议避免。
# 本机单机验证无时序库，先关闭避免作业写库失败刷日志；部署到有 TSDB 的机器再改回 true
flink.tsdb.enabled=true
flink.tsdb.url=jdbc:postgresql://localhost:5432/maritime
flink.tsdb.user=kag
flink.tsdb.password=kag@timescale
flink.tsdb.table=stream_events
flink.tsdb.time-field=
# 前端「右键 → 历史轨迹」单次查询的最大返回行数（读路径；请求可传 limit 覆盖，上限即此值）
flink.tsdb.history-max-rows=20000

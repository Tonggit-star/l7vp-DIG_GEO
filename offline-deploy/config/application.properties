# 部署侧外部配置（挂载到容器 /opt/l7vp/config/application.properties）
#
# 优先级，从高到低：
#   1. docker-compose.yml 的 environment:   （OS 环境变量）
#   2. 本文件                                （jar 外部的 config/application.properties）
#   3. jar 内置的 application.properties
#
# 也就是说：本文件里写的键，会被 compose environment 里的同名键覆盖；
# 没写的键继续沿用 jar 内置值（是【合并】不是替换，不必把内置配置抄一遍）。
#
# 端口、达梦连接、Flink/TSDB 地址这些都在 compose 的 environment: 里，
# 这里只放【不适合用环境变量表达】的项。

# ---------------------------------------------------------------- 容器内静态目录
# jar 内置值是开发机路径（../website/public/icons），在容器里会解析成
# /opt/website/public/icons —— 该目录不存在，图标会全部 404，必须改掉。
l7vp.icons.path=/opt/l7vp/icons
l7vp.thumbnails.path=/opt/l7vp/thumbnails

# ------------------------------------------------------------------ 日志
# INFO 足够日常验证；排查问题时临时改成 DEBUG。
logging.level.com.antv.l7vp=INFO

# ------------------------------------------------------- 以下为「按需打开」的项
#
# 不要在文件里硬写 spring.datasource.hikari.connection-init-sql。
# jar 内置配置已经有 SET SCHEMA DIG_GEO，而覆盖 URL/账号/口令并不会顶掉它。
# 该属性名带连字符，环境变量形式（SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL）
# 极易拼错且拼错不报错、静默用默认值 —— 所以一律别碰。
#
# 会话超时（秒），默认 8 小时
# server.servlet.session.timeout=28800
#
# 上传大小限制
# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=50MB
